<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script src="./src/main.js" type="module" defer></script>
    <script
      src="./src/site/pages/scripts/header.js"
      type="module"
      defer
    ></script>
    <script
      src="./src/site/pages/scripts/sign-up.js"
      type="module"
      defer
    ></script>
  </head>

  <body>
    <header id="header">
      <a href="/index.html" class="logo">GD: Geometry Death</a>

      <nav class="nav">
        <a href="#" class="nav-profile-container" id="nav-link">
          <div class="text-container" id="profile-text-container">
            <span id="username">username</span>
            <span id="account-role">GUEST</span>
            <span id="sign-up" class="sign-up">Sign up</span>
          </div>
          <div class="img-container">
            <img id="profile-icon" src="/assets/icons/profile.svg" alt="" />
          </div>
        </a>
      </nav>
    </header>

    <section class="intro-section" id="intro-section">
      <div id="intro-container">
        <div class="text">
          <h1>Welcome, Player!</h1>
          <h3>Enter your username to begin.</h3>
        </div>

        <input
          type="text"
          placeholder="Please enter your username"
          id="input"
        />
      </div>

      <div id="mobile-container">
        <h1>Geometry Death</h1>
        <h1 id="mobile-error-message"></h1>
      </div>
    </section>

    <div class="tutorial-container" id="tutorial-container">
      <div class="inner-container">
        <div class="tutorial-text-elements">
          <h2>Dodge Balls!</h2>
        </div>

        <img src="./assets/gifs/tutorial.gif" alt="" class="tutorial-gif" />

        <div class="tutorial-btns">
          <button class="skip-btn" id="skip-btn">Skip tutorial</button>
          <button class="next-btn" id="next-btn">Next -></button>
        </div>
      </div>
    </div>

    <div class="modal-section" id="sign-up-modal">
      <div class="modal-form" id="modal-form">
        <h2>Sign up</h2>
        <label for="">Enter username to create a Guest Account</label>
        <input type="text" placeholder="username" id="username-input" />
        <button class="call-to-action create-guest" id="sign-up-button">
          sign up
        </button>
      </div>
    </div>

    <canvas id="canvas"></canvas>
  </body>
</html>
