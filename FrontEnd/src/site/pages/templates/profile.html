<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/styles/profile.css" />
    <script src="../scripts/profile.js" type="module" defer></script>
  </head>
  <body>
    <header id="header">
      <a href="/index.html" class="logo">GD: Geometry Death</a>

      <nav class="nav">
        <a href="#" class="nav-profile-container" id="profile-container">
          <div class="text-container" id="profile-text-container">
            <span id="username">username</span>
            <span id="account-role">GUEST</span>
            <span class="sign-up">Sign up</span>
          </div>
          <div class="img-container">
            <img id="profile-icon" src="/assets/icons/profile.svg" alt="" />
          </div>
        </a>
      </nav>
    </header>

    <main class="profile-section">
      <div id="profile-main-container">
        <div class="profile-head profile-element-container">
          <div class="profile-head-contents">
            <div class="profile-avatar">
              <img src="/assets/icons/profile.svg" alt="Resourse not found" />
            </div>

            <div class="profile-head-panel">
              <span id="head-panel-username">username</span>

              <div class="profile-head-info">
                <div class="head-info-element">
                  <img src="/assets/icons/email.svg" alt="" />
                  <span>noob</span>
                </div>

                <div class="head-info-element">
                  <img src="/assets/icons/email.svg" alt="" />
                  <span>email or guest status</span>
                </div>
              </div>
            </div>
          </div>

          <hr />

          <nav class="profile-nav">
            <a href="./profile.html" class="active-link">Info</a>
            <a href="./history.html">History</a>
            <a href="./stats.html">Stats</a>
            <a href="#">TO DO</a>
          </nav>
        </div>

        <hr class="profile-divide" />

        <div class="profile-body profile-element-container">
          <div class="profile-info-container">
            <div class="uhead">
              <h3>Profile</h3>
            </div>
            <ul class="info-list utable">
              <li>
                <div class="col1">User Name</div>
                <div class="col2">username placeholder</div>
              </li>
              <li>
                <div class="col1">E-mail</div>
                <div class="col2">email placeholder</div>
              </li>
              <li>
                <div class="col1">About</div>
                <div class="col2">about placeholder</div>
              </li>
              <li>
                <div class="col1">Registered</div>
                <div class="col2 text-capitalize">
                  Registered date placeholder
                </div>
              </li>
            </ul>
          </div>

          <div class="profile-body-buttons">
            <button class="profile-button ghost">SIGN OUT</button>
            <button
              class="profile-button call-to-action"
              id="update-profile-button"
            >
              UPDATE PROFILE
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
